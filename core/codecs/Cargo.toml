[package]
name = "chitrakar-codecs"
description = "Import/export codecs (PNG, JPEG now; TIFF, SVG, PDF later)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chitrakar-color.workspace = true
chitrakar-doc.workspace = true
chitrakar-render.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Container format. Default features pull native compression stacks that
# don't build on wasm32; deflate alone is pure Rust.
zip = { version = "2", default-features = false, features = ["deflate"] }
tiff = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
