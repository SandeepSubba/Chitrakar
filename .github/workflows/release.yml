name: Release builds

# Desktop installers for Windows, macOS (Intel + Apple Silicon), and Linux.
# Runs on version tags (v*) — publishing a draft GitHub release with the
# bundles attached — and on manual dispatch, uploading them as workflow
# artifacts instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            shells/tauri/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # Builds the wasm engine + UI (beforeBuildCommand), compiles the
      # shell, and bundles platform installers. On a tag it also creates a
      # draft GitHub release with the bundles attached.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: shells/tauri/src-tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Chitrakar {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload bundles as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: chitrakar-${{ matrix.platform }}${{ matrix.args && '-' }}${{ matrix.args }}
          path: |
            shells/tauri/src-tauri/target/**/release/bundle/**/*.deb
            shells/tauri/src-tauri/target/**/release/bundle/**/*.rpm
            shells/tauri/src-tauri/target/**/release/bundle/**/*.AppImage
            shells/tauri/src-tauri/target/**/release/bundle/**/*.dmg
            shells/tauri/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            shells/tauri/src-tauri/target/**/release/bundle/**/*.msi
            shells/tauri/src-tauri/target/**/release/bundle/**/*.exe
            shells/tauri/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
