name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain, components and targets all come from rust-toolchain.toml,
      # so CI and a dev machine run the same clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver, so the GPU backend's comparison against
      # the CPU reference actually runs here instead of skipping.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI (wasm engine, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Toolchain, components and targets all come from rust-toolchain.toml,
      # so CI and a dev machine run the same clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Runs build:wasm (wasm-pack) first, then tsc + vite.
      - run: npm run build

  e2e:
    name: Browser smoke suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Toolchain, components and targets all come from rust-toolchain.toml,
      # so CI and a dev machine run the same clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  shell:
    name: Tauri shell (clippy and tests, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev
      # Toolchain, components and targets all come from rust-toolchain.toml,
      # so CI and a dev machine run the same clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # tauri-build resolves frontendDist at compile time, so build the UI first.
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: shells/tauri/src-tauri
      # What the shell does with files by path — the whole write, a path
      # through a header — tested without a window.
      - run: cargo test
        working-directory: shells/tauri/src-tauri

  shell-macos:
    # What only compiles on a Mac: the files the system opens with the
    # app (RunEvent::Opened) and the Swift that asks Vision for a subject.
    name: Tauri shell (check, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: shells/tauri/src-tauri

  shell-android:
    # The shell compiled for a phone: what a desktop build never asks of
    # it — the dialog plugin's mobile half, the files handed over by
    # RunEvent::Opened, the GPU mirror against Android's Vulkan. The
    # runner's Android NDK supplies the C compiler the build scripts call.
    name: Tauri shell (clippy, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - name: cargo clippy --target aarch64-linux-android
        working-directory: shells/tauri/src-tauri
        run: |
          N="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$N/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$N/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$N/aarch64-linux-android24-clang"
          cargo clippy --target aarch64-linux-android -- -D warnings

  shell-ios:
    # The same for an iPhone or an iPad, on the only machine that has
    # the SDK: and a Mac building for iOS is where the build script's
    # own platform and the app's differ, which the Swift subject matte
    # has to tell apart.
    name: Tauri shell (clippy, iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo clippy --target aarch64-apple-ios -- -D warnings
        working-directory: shells/tauri/src-tauri

  android-apk:
    # An installable build for a phone, every time: the Android project
    # is generated here, where the runner has the SDK and the NDK, rather
    # than committed — `tauri android init` writes it from tauri.conf.json,
    # so there is nothing in it to keep in step by hand.
    #
    # A release build, optimised: the debug one was 135 MB and ran the
    # engine unoptimised, which on a phone is the difference between a
    # filter that answers and one that does not. Signed with a key made
    # here and thrown away with the runner — enough to install it, and no
    # secret to keep; a store build wants a key of its own. Each run's key
    # is new, so installing one over another needs the old one removed.
    name: Android APK (release, test-signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Generate the Android project and build the APK
        working-directory: shells/tauri
        # Through `npm run tauri` (shells/tauri/package.json): the Gradle
        # build calls the CLI back the way it was started, and a package
        # script is the one way it knows how to call back from inside
        # gen/android.
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri -- android init --ci --skip-targets-install
          npm run tauri -- android build --ci --apk --target aarch64
      - name: Sign it with a throwaway key
        run: |
          unsigned=$(find shells/tauri/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          test -n "$unsigned"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore test.jks -storepass chitrakar -keypass chitrakar \
            -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Chitrakar test build"
          "$tools/zipalign" -f 4 "$unsigned" aligned.apk
          mkdir -p out
          "$tools/apksigner" sign --ks test.jks --ks-pass pass:chitrakar --out out/chitrakar-arm64.apk aligned.apk
          "$tools/apksigner" verify out/chitrakar-arm64.apk
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: chitrakar-android-arm64
          path: out/chitrakar-arm64.apk
          if-no-files-found: error
